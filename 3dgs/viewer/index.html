<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DGS Viewer - test.mp4</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; user-select:none; -webkit-user-select:none; cursor:grab; }
    body:active { cursor:grabbing; }
    #hud { position:fixed; top:8px; left:8px; color:#fff; font:11px monospace; z-index:100; pointer-events:none; opacity:0.6; }
    #help { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.35); font:11px system-ui; pointer-events:none; text-align:center; }
    #ctls { position:fixed; bottom:4px; left:50%; transform:translateX(-50%); z-index:200; display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }
    #ctls button { background:rgba(255,255,255,0.1); color:#aaa; border:1px solid rgba(255,255,255,0.15); padding:3px 8px; border-radius:3px; cursor:pointer; font-size:10px; }
    #ctls button:hover { background:rgba(255,255,255,0.2); color:#fff; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="help">Drag: Rotate &nbsp;|&nbsp; Wheel: Zoom &nbsp;|&nbsp; WASD/Arrows: Move &nbsp;|&nbsp; R: Reset &nbsp;|&nbsp; +/-: Point Size</div>
  <div id="ctls">
    <button onclick="nav('up')">↑</button><button onclick="nav('down')">↓</button>
    <button onclick="nav('left')">←</button><button onclick="nav('right')">→</button>
    <button onclick="nav('in')">+</button><button onclick="nav('out')">−</button>
    <button onclick="nav('reset')">Reset</button>
    <button onclick="nav('top')">Top</button>
    <button onclick="nav('front')">Front</button>
    <button onclick="nav('side')">Side</button>
    <button onclick="toggleAuto()">Auto Spin</button>
    <button onclick="psize(1.5)">Bigger</button>
    <button onclick="psize(0.7)">Smaller</button>
  </div>

  <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>

  <script type="module">
    import * as THREE from 'three';

    const HUD = document.getElementById('hud');
    HUD.textContent = 'Loading...';

    // ── Setup ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0.1, 0.1, 0.13);
    scene.fog = new THREE.Fog(0.1, 20, 80);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 300);
    const renderer = new THREE.WebGLRenderer({ alpha: false, antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ── Parse PLY ──
    const resp = await fetch('ruler.ply');
    const buf = await resp.arrayBuffer();
    const hdrEnd = new TextDecoder().decode(buf).indexOf('end_header\n') + 11;
    const floats = new Float32Array(buf.slice(hdrEnd));
    const total = Math.floor(floats.length / 62);

    HUD.textContent = `Parsing ${total} splats...`;

    // Use ALL splats
    const count = total;
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    const SH = 0.28209479177387814;
    let sumX = 0, sumY = 0, sumZ = 0;

    for (let i = 0; i < count; i++) {
      const o = i * 62;
      const x = floats[o], y = floats[o + 1], z = floats[o + 2];
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      col[i * 3]     = Math.min(1, Math.max(0, 0.5 + SH * floats[o + 6]));
      col[i * 3 + 1] = Math.min(1, Math.max(0, 0.5 + SH * floats[o + 7]));
      col[i * 3 + 2] = Math.min(1, Math.max(0, 0.5 + SH * floats[o + 8]));
      sumX += x; sumY += y; sumZ += z;
    }

    HUD.textContent = `Uploading ${count} points to GPU...`;

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(col, 3));

    const mat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec3 vColor;
        uniform float uSize;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = uSize * (200.0 / -mv.z);
          gl_PointSize = clamp(gl_PointSize, 0.3, 30.0);
          gl_Position = projectionMatrix * mv;
          vColor = color;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;
          if (d > 1.0) discard;
          float a = 1.0 - d * d;
          gl_FragColor = vec4(vColor, a * 0.6);
        }
      `,
      uniforms: { uSize: { value: 0.08 } },
      vertexColors: true, transparent: true, depthWrite: false
    });

    const points = new THREE.Points(geom, mat);
    scene.add(points);

    // ── Camera ──
    const cx = sumX / count, cy = sumY / count, cz = sumZ / count;
    const target = new THREE.Vector3(cx, cy, cz);
    let theta = 0, phi = Math.PI / 3, radius = 8, pointSize = 0.08;

    // ── Reusable vectors (NO per-frame allocation!) ──
    const _fwd = new THREE.Vector3();
    const _right = new THREE.Vector3();
    const _v1 = new THREE.Vector3();
    const _v2 = new THREE.Vector3();

    function updateCam() {
      camera.position.set(
        target.x + radius * Math.sin(phi) * Math.cos(theta),
        target.y + radius * Math.cos(phi),
        target.z + radius * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);
    }
    updateCam();

    let frameCount = 0;
    function updateHUD() {
      if (++frameCount % 30 !== 0) return;
      HUD.textContent = `${count} pts | dist:${radius.toFixed(1)} | size:${pointSize.toFixed(3)} | ${camera.position.x.toFixed(1)},${camera.position.y.toFixed(1)},${camera.position.z.toFixed(1)}`;
    }

    // ── Mouse (pointermove on WINDOW for smooth tracking) ──
    let dragging = false, rightDrag = false, px = 0, py = 0;

    function onPointerDown(e) {
      dragging = true; rightDrag = e.button === 2;
      px = e.clientX; py = e.clientY;
      autoRotate = false; // stop auto-rotate on user interaction
    }
    function onPointerUp() { dragging = false; }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - px, dy = e.clientY - py;
      if (rightDrag) {
        _fwd.subVectors(camera.position, target).normalize();
        _right.crossVectors(camera.up, _fwd).normalize();
        target.addScaledVector(_right, -dx * radius * 0.002);
        target.addScaledVector(camera.up, dy * radius * 0.002);
      } else {
        theta -= dx * 0.008;  // Increased sensitivity
        phi = Math.max(0.02, Math.min(Math.PI - 0.02, phi - dy * 0.008));
      }
      px = e.clientX; py = e.clientY;
      updateCam();
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointermove', onPointerMove);  // Also on canvas

    renderer.domElement.addEventListener('wheel', e => {
      radius = Math.max(0.3, Math.min(80, radius + e.deltaY * 0.01));
      updateCam();
    }, { passive: true });
    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

    // ── Keyboard ──
    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function processKeys() {
      const anyKey = keys['w']||keys['a']||keys['s']||keys['d']||
        keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright']||
        keys['q']||keys['e']||keys['r']||keys['-']||keys['=']||keys['+'];
      if (!anyKey) return;

      const speed = radius * 0.03;

      // Only compute directions when needed
      if (keys['w']||keys['a']||keys['s']||keys['d']||keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright']||keys['q']||keys['e']) {
        _fwd.subVectors(target, camera.position).normalize();
        _right.crossVectors(_fwd, camera.up).normalize();
      }

      if (keys['w'] || keys['arrowup'])    target.addScaledVector(_fwd, speed);
      if (keys['s'] || keys['arrowdown'])  target.addScaledVector(_fwd, -speed);
      if (keys['a'] || keys['arrowleft'])  target.addScaledVector(_right, -speed);
      if (keys['d'] || keys['arrowright']) target.addScaledVector(_right, speed);
      if (keys['q']) target.y -= speed;
      if (keys['e']) target.y += speed;
      if (keys['r']) { target.set(cx, cy, cz); theta = 0; phi = Math.PI/3; radius = 8; pointSize = 0.08; mat.uniforms.uSize.value = pointSize; }
      if (keys[' ']) { autoRotate = !autoRotate; keys[' '] = false; HUD.textContent = autoRotate ? 'Auto-rotate: ON (Space to stop)' : 'Auto-rotate: OFF'; }
      if (keys['-']) { pointSize *= 0.95; mat.uniforms.uSize.value = pointSize; }
      if (keys['='] || keys['+']) { pointSize *= 1.05; mat.uniforms.uSize.value = pointSize; }

      updateCam();
    }

    // ── UI buttons ──
    window.nav = (dir) => {
      const s = radius * 0.2;
      if (dir === 'up') { phi += 0.15; }
      else if (dir === 'down') { phi -= 0.15; }
      else if (dir === 'left') { theta -= 0.2; }
      else if (dir === 'right') { theta += 0.2; }
      else if (dir === 'in') { radius = Math.max(0.3, radius - s); }
      else if (dir === 'out') { radius = Math.min(80, radius + s); }
      else if (dir === 'reset') { target.set(cx, cy, cz); theta = 0; phi = Math.PI / 3; radius = 8; pointSize = 0.08; mat.uniforms.uSize.value = pointSize; }
      else if (dir === 'top') { phi = 0.02; theta = 0; target.set(cx, cy, cz); radius = 15; }
      else if (dir === 'front') { phi = Math.PI / 2; theta = 0; target.set(cx, cy, cz); radius = 8; }
      else if (dir === 'side') { phi = Math.PI / 2; theta = Math.PI / 2; target.set(cx, cy, cz); radius = 8; }
      updateCam();
    };
    window.psize = (v) => { pointSize *= v; pointSize = Math.max(0.005, Math.min(1, pointSize)); mat.uniforms.uSize.value = pointSize; };

    // ── Auto-rotate ──
    let autoRotate = true;  // Start with auto-rotate ON
    window.toggleAuto = () => { autoRotate = !autoRotate; HUD.textContent = autoRotate ? 'Auto-rotate: ON' : 'Auto-rotate: OFF'; };

    // ── Render loop ──
    let hudTimer = 0;
    function animate() {
      requestAnimationFrame(animate);
      processKeys();

      if (autoRotate && !dragging) {
        theta += 0.003;  // Slow auto-spin
        updateCam();
      }

      renderer.render(scene, camera);

      // HUD every 2 seconds
      hudTimer++;
      if (hudTimer >= 120) {
        hudTimer = 0;
        HUD.textContent = `${count} pts | autospin:${autoRotate?'ON':'OFF'} | dist:${radius.toFixed(1)} | size:${pointSize.toFixed(3)}`;
      }
    }
    animate();

    HUD.textContent = `${count} splats ready | Drag/WASD to move | Space=toggle auto-spin`;
  </script>
</body>
</html>
