[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers --tb=short

markers =
    slow: slow end-to-end or model training cases, skipped in CI by default
    requires_db: needs backend/welding.db.seed
    requires_torch: needs torch installed

asyncio_mode = auto

norecursedirs = .git __pycache__ *.egg-info pdf_generator
